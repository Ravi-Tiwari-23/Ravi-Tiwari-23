  <style>text{font-family:'Segoe UI',Inter,Arial,sans-serif}.label{font-size:13px;fill:#64748B}.value{font-size:20px;font-weight:700;fill:#0F172A}.heading{font-size:17px;font-weight:700;fill:#2563EB}.foot{font-size:11px;fill:#64748B}</style>
  <text class="heading" x="260" y="32" text-anchor="middle">Contribution Consistency</text>
