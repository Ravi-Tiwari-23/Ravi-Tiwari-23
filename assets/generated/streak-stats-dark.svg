  <rect x="0.5" y="0.5" width="519" height="184" rx="12" fill="#0B1220" stroke="#24324A"/>
  <style>text{font-family:'Segoe UI',Inter,Arial,sans-serif}.label{font-size:13px;fill:#94A3B8}.value{font-size:20px;font-weight:700;fill:#E2E8F0}.heading{font-size:17px;font-weight:700;fill:#60A5FA}.foot{font-size:11px;fill:#94A3B8}</style>
  <text class="heading" x="260" y="32" text-anchor="middle">Contribution Consistency</text>
  <text x="87" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#22D3EE">144</text>
  <text class="label" x="87" y="122" text-anchor="middle">Visible Contributions</text>
  <path d="M173 58V132" stroke="#24324A"/>
