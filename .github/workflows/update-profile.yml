name: Update dynamic profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/profile.yaml"
      - "templates/profile.md.j2"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Fetch, validate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run mocked automation tests
        run: python -m pytest

      - name: Fetch verified public GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github.py

      - name: Generate repository-owned statistics cards
        run: python scripts/generate_stats.py

      - name: Generate README from template
        run: python scripts/generate_readme.py

      - name: Validate generated README and SVG assets
        run: python scripts/validate_readme.py

      - name: Commit only meaningful changes
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/generated; then
            echo "README and statistics cards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git commit -m "chore: refresh dynamic profile"
          git push origin HEAD:main
