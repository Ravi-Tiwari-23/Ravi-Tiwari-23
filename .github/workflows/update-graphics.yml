name: Update contribution graphics

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contribution-graphics
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish SVG assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2563EB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22D3EE

      - name: Validate generated SVG assets
        shell: bash
        run: |
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          grep -q '<svg' dist/github-contribution-grid-snake.svg
          grep -q '<svg' dist/github-contribution-grid-snake-dark.svg

      - name: Publish generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          build_dir: dist
          target_branch: output
          keep_history: false
          jekyll: false
          commit_message: "chore: update contribution graphics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
